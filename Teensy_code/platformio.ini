[env:teensy40]
platform = teensy
board = teensy40
framework = arduino

; ===============================
; Upload
; ===============================
upload_protocol = teensy-cli
upload_flags = -w

; ===============================
; Monitor Serial
; ===============================
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; ===============================
; Build Optimization
; ===============================
build_flags =
    -O2
    -std=gnu++17
    -D SERIAL_DEBUG=1
    -I include

; ===============================
; Bibliotecas
; ===============================
lib_deps =
    pololu/VL53L0X @ ^1.3.1
    adafruit/Adafruit BNO055 @ ^1.6.4
    adafruit/Adafruit NeoPixel @ ^1.12.5
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.11.0
    ; adafruit/Adafruit Sensor @ ^1.1.15

    

; ===============================
; I2C performance
; ===============================
build_unflags = -Os
